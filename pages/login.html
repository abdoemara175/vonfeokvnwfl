<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول | Pixel UI/UX Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-cubes-stacked"></i></span>
        <span>PIXEL <span style="color: var(--primary-purple);">PLATFORM</span></span>
      </a>

      <div class="controls-group">
        <button class="btn btn-outline btn-sm lang-toggle-btn" onclick="window.i18n.toggleLang()">English</button>
        <button class="btn btn-outline btn-sm" onclick="window.i18n.toggleTheme()"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </header>

  <!-- Login Form -->
  <main class="container" style="padding: 4rem 1.5rem; display: flex; justify-content: center;">
    <div class="glass-card" style="width: 100%; max-width: 440px; padding: 2.5rem;">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.6rem; margin-bottom: 0.5rem;" data-i18n="navLogin">تسجيل الدخول</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">أهلاً بك مجدداً في منصة ومجتمع Pixel</p>
      </div>

      <button type="button" class="btn btn-outline" style="width: 100%; justify-content: center; margin-bottom: 1.5rem;" id="google-login-btn">
        <i class="fa-brands fa-google" style="color: #ea4335;"></i> الدخول باستخدام حساب Google
      </button>

      <div style="text-align: center; color: var(--text-dim); margin-bottom: 1.5rem; font-size: 0.85rem;">أو بالبريد الإلكتروني</div>

      <form id="login-form">
        <div style="margin-bottom: 1.25rem;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">البريد الإلكتروني</label>
          <input type="email" id="login-email" required placeholder="example@pixel.com" style="width: 100%; padding: 0.75rem; background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-main);">
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label style="display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem;">كلمة المرور</label>
          <input type="password" id="login-password" required placeholder="••••••••" style="width: 100%; padding: 0.75rem; background: var(--bg-body); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-main);">
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center;" data-i18n="navLogin">تسجيل الدخول</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem;">
        <span style="color: var(--text-muted);">ليس لديك حساب؟</span>
        <a href="signup.html" style="color: var(--primary-glow); font-weight: 600; text-decoration: none;" data-i18n="navSignup">إنشاء حساب جديد</a>
      </div>

    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const pass = document.getElementById('login-password').value;

      const res = window.pixelAuth.login(email, pass);
      if (res.success) {
        window.location.href = 'dashboard.html';
      } else {
        alert(res.message);
      }
    });

    document.getElementById('google-login-btn').addEventListener('click', () => {
      const res = window.pixelAuth.loginWithGoogle();
      if (res.success) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
