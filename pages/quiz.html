<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبار التفاعلي | Pixel UI/UX Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="logo">
        <span class="logo-icon"><i class="fa-solid fa-cubes-stacked"></i></span>
        <span>PIXEL <span style="color: var(--primary-purple);">PLATFORM</span></span>
      </a>

      <nav class="nav-links">
        <a href="../index.html" class="nav-link" data-i18n="navHome">الرئيسية</a>
        <a href="levels.html" class="nav-link" data-i18n="navCourses">المناهج والمسارات</a>
        <a href="lesson-detail.html" class="nav-link" data-i18n="navSliders">شروحات تفاعلية</a>
        <a href="quiz.html" class="nav-link active" data-i18n="navQuiz">الاختبار التفاعلي</a>
        <a href="dashboard.html" class="nav-link" data-i18n="navDashboard">لوحة التحكم</a>
      </nav>

      <div class="controls-group">
        <button class="btn btn-outline btn-sm lang-toggle-btn" onclick="window.i18n.toggleLang()">English</button>
        <button class="btn btn-outline btn-sm" onclick="window.i18n.toggleTheme()"><i class="fa-solid fa-moon"></i></button>
        <a href="login.html" class="btn btn-primary btn-sm" id="auth-nav-btn" data-i18n="navLogin">تسجيل الدخول</a>
      </div>
    </div>
  </header>

  <!-- Quiz Container -->
  <main class="container" style="padding: 3rem 1.5rem 6rem;">
    <div class="glass-card" style="max-width: 800px; margin: 0 auto; padding: 2.5rem;">
      
      <div style="text-align: center; margin-bottom: 2rem;">
        <span class="badge badge-purple" style="margin-bottom: 0.75rem;"><i class="fa-solid fa-award"></i> Pixel Camp Round 1</span>
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;" data-i18n="quizTitle">اختبار قياس المستوى والتحدي البرمجي</h1>
        <p style="color: var(--text-muted);" data-i18n="quizSubtitle">اختبار مكثف يتطلب دقة 80% على الأقل لفتح الموضوع التالي والحصول على وسام الإنجاز.</p>
        <p style="color: var(--primary-glow); font-size: 0.85rem; margin-top: 0.5rem;" data-i18n="passThresholdInfo">نسبة النجاح المطلوبة: 80% | محاولات محدودة لضمان الجدية</p>
      </div>

      <!-- Quiz Form -->
      <form id="quiz-form">
        <div id="quiz-questions-container">
          <!-- Dynamically Injected Questions -->
        </div>

        <div style="margin-top: 2.5rem; text-align: center;">
          <button type="submit" class="btn btn-primary" style="padding: 0.85rem 2.5rem; font-size: 1rem;">
            <i class="fa-solid fa-paper-plane"></i> <span data-i18n="submitQuiz">تسليم الإجابات وتقييم النتيجة</span>
          </button>
        </div>
      </form>

      <!-- Results Box -->
      <div id="quiz-result-box" style="display: none; margin-top: 2rem; padding: 2rem; border-radius: var(--radius-lg); text-align: center;">
        <i id="result-icon" class="fa-solid" style="font-size: 3.5rem; margin-bottom: 1rem;"></i>
        <h2 id="result-title" style="margin-bottom: 0.5rem;"></h2>
        <p id="result-score" style="font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem;"></p>
        <p id="result-desc" style="color: var(--text-muted); margin-bottom: 1.5rem;"></p>
        <div id="result-actions"></div>
      </div>

    </div>
  </main>

  <script src="../js/i18n.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/quiz.js"></script>
</body>
</html>
